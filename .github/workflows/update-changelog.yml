name: "Update Changelog"

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: master
          # The default GITHUB_TOKEN cannot push to master once branch
          # protection requires changes to go through a pull request, because
          # that token is not a repository admin. CHANGELOG_TOKEN is a
          # fine-grained PAT owned by a repository admin. The fallback keeps
          # the checkout working while the secret is missing; the commit step
          # then behaves as before.
          token: ${{ secrets.CHANGELOG_TOKEN || github.token }}

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: master
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
