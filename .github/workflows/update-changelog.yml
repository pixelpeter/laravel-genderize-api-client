name: "Update Changelog"

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # This job checks out with an admin-owned token and leaves it in the
      # runner's git config for the commit step, so every action below is
      # pinned to a commit SHA. A moving tag would let a compromised release
      # of one of them use that token. Dependabot still updates the pins.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          # Branch protection on master is enforced for non-admins, and the
          # default GITHUB_TOKEN is not a repository admin, so its push is
          # rejected with GH006. CHANGELOG_TOKEN is a fine-grained PAT owned by
          # an admin, scoped to contents write on this repository. The fallback
          # keeps the checkout working while the secret is missing; the commit
          # step then fails as it does today.
          token: ${{ secrets.CHANGELOG_TOKEN || github.token }}

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          branch: master
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
